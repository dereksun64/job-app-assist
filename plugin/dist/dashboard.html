<style>
/* Layout: a masthead with the Search Profile as a ledger strip, then one tabbed workspace. */
:root {
  --bg: #f4f6f9;
  --surface: #ffffff;
  --ink: #172030;
  --muted: #5a6577;
  --line: #dce2eb;
  --accent: #2f5bd3;
  --accent-soft: #e5ebfb;
  --notice-bg: #fff3dc;
  --notice-ink: #6f4500;
  --problem-bg: #fcebeb;
  --problem-ink: #9a1d1d;

  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Instrument Sans", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --step--1: 0.8125rem;
  --step-0: 0.9375rem;
  --step-1: 1.125rem;
  --step-2: 1.5rem;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e131b;
    --surface: #151c27;
    --ink: #e5e9f0;
    --muted: #98a3b6;
    --line: #263041;
    --accent: #84a1ff;
    --accent-soft: #1d2a4f;
    --notice-bg: #33270f;
    --notice-ink: #f1c879;
    --problem-bg: #3a1818;
    --problem-ink: #ffb4b4;
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: #0e131b;
  --surface: #151c27;
  --ink: #e5e9f0;
  --muted: #98a3b6;
  --line: #263041;
  --accent: #84a1ff;
  --accent-soft: #1d2a4f;
  --notice-bg: #33270f;
  --notice-ink: #f1c879;
  --problem-bg: #3a1818;
  --problem-ink: #ffb4b4;
  color-scheme: dark;
}

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--step-0);
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

.shell {
  max-width: 68rem;
  margin-inline: auto;
  padding-block: 1.5rem 2rem;
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
}

h1,
h2 {
  font-family: var(--font-display);
  text-wrap: balance;
  margin: 0;
}

p {
  margin: 0;
}

code {
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
}

/* Masthead and Search Profile ledger */

.masthead {
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.wordmark {
  font-size: var(--step-2);
  font-weight: 700;
  letter-spacing: -0.01em;
}

.profile dl {
  margin: 0;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
}

.fact {
  background: var(--surface);
  padding: 0.75rem 1rem;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
}

.fact-wide {
  grid-column: 1 / -1;
}

.fact dt {
  font-size: var(--step--1);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--muted);
}

.fact dd {
  margin: 0;
  overflow-wrap: anywhere;
}

.numeric {
  font-variant-numeric: tabular-nums;
}

.groups {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-wrap: wrap;
  gap: 0.25rem 1.5rem;
}

.group-label {
  font-weight: 600;
}

/* Notices */

.notice {
  margin: 0;
  padding: 0.75rem 1rem;
  border-radius: 10px;
  background: var(--notice-bg);
  color: var(--notice-ink);
}

.notice-quiet {
  background: var(--accent-soft);
  color: var(--ink);
}

.notice-problem {
  background: var(--problem-bg);
  color: var(--problem-ink);
}

.issues {
  margin: 0.5rem 0 0;
  padding-left: 1.25rem;
  font-family: var(--font-mono);
  font-size: var(--step--1);
}

/* Tabs */

.workspace {
  display: flex;
  flex-direction: column;
}

.tabs {
  display: flex;
  gap: 0.25rem;
  border-bottom: 1px solid var(--line);
}

.tab {
  appearance: none;
  border: 0;
  background: none;
  color: var(--muted);
  font: inherit;
  font-weight: 600;
  padding: 0.625rem 0.875rem;
  margin-bottom: -1px;
  border-bottom: 2px solid transparent;
  cursor: pointer;
  white-space: nowrap;
}

.tab:hover {
  color: var(--ink);
}

.tab[aria-selected="true"] {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

.tab:focus-visible,
.panel:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 4px;
}

.panel {
  padding-block: 2.5rem;
}

/* Empty states */

.empty {
  max-width: 34rem;
  margin-inline: auto;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.75rem;
  color: var(--muted);
}

.empty h2 {
  font-size: var(--step-1);
  color: var(--ink);
}

.stages {
  list-style: none;
  margin: 0.5rem 0 0;
  padding: 0;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 0.5rem;
}

.stages li {
  padding: 0.25rem 0.75rem;
  border: 1px dashed var(--line);
  border-radius: 999px;
  font-size: var(--step--1);
  color: var(--muted);
}

.colophon {
  font-size: var(--step--1);
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}

@media (max-width: 40rem) {
  .profile dl {
    grid-template-columns: minmax(0, 1fr);
  }

  /* Short facts become one row each, so the tabs stay near the top on a phone. */
  .fact:not(.fact-wide) {
    flex-direction: row;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
  }

  .fact:not(.fact-wide) dd {
    text-align: right;
  }

  .panel {
    padding-block: 1.75rem;
  }
}

@media (prefers-reduced-motion: reduce) {
  * {
    transition: none !important;
    animation: none !important;
  }
}
