.empty-compact {

/* Detail drawer: a modal panel from the right edge, full height, scrolling on its own. */
.drawer {
  box-sizing: border-box;
  margin: 0 0 0 auto;
  padding: 0;
  width: min(36rem, 100vw);
  max-width: 100vw;
  height: 100dvh;
  max-height: 100dvh;
  border: 0;
  border-left: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  box-shadow: -12px 0 32px rgb(10 16 28 / 0.18);
}

.drawer[open] {
  animation: drawer-in 180ms ease-out;
}

/* The page behind an open drawer stays put. */
html:has(.drawer[open]) {
  overflow: hidden;
}

@media (max-width: 36rem) {
  .drawer {
    border-left: 0;
    box-shadow: none;
  }

  .drawer-body {

}

.drawer::backdrop {

}

    opacity: 0;

}

  height: 100%;

  padding: 1.25rem 1.5rem 1rem;
  border-bottom: 1px solid var(--line);
}

  color: var(--muted);
}

  line-height: 1.3;

}

  place-items: center;
  width: 2rem;
  height: 2rem;
  margin: -0.25rem -0.5rem 0 0;
  appearance: none;
  border: 0;
  border-radius: 8px;
  background: none;
  color: var(--muted);
  cursor: pointer;
}

.drawer-close:hover {
  background: var(--bg);
  color: var(--ink);
}

.drawer-close path {
  stroke: currentColor;
  stroke-width: 1.75;
  stroke-linecap: round;
}

.drawer-body {
  flex: 1;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 1.25rem 1.5rem 2rem;
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
}

.drawer-apply {
  align-self: flex-start;
  padding: 0.5rem 1rem;
  border-radius: 999px;
  background: var(--accent);
  color: var(--surface);
  font-weight: 600;
  text-decoration: none;
}

.drawer-apply:hover {
  filter: brightness(1.08);
}

.drawer-apply-host {
  font-weight: 400;
  opacity: 0.85;
}

.drawer-section {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.drawer-heading {
  margin: 0;
  font-size: var(--step--1);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--muted);
}

.variant-choice {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.variant-choice select {
  font: inherit;
  font-weight: 500;
  color: var(--ink);
  background-color: var(--bg);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 0.4375rem 2rem 0.4375rem 0.625rem;
  min-width: 0;
  max-width: 100%;
  appearance: none;
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted) 50%),
    linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position:
    calc(100% - 1rem) 50%,
    calc(100% - 0.6875rem) 50%;
  background-size: 0.3125rem 0.3125rem;
  background-repeat: no-repeat;
}

.variant-status {
  font-size: var(--step--1);
  color: var(--muted);
}

.variant-name {
  font-weight: 500;
}

.variant-reason {
  font-size: var(--step--1);
  overflow-wrap: anywhere;
}

.variant-error {
  padding: 0.5rem 0.75rem;
  border-radius: 8px;
  background: var(--problem-bg);
  color: var(--problem-ink);
  font-size: var(--step--1);
}

.drawer-facts {
  margin: 0;
  display: grid;
  grid-template-columns: max-content minmax(0, 1fr);
  gap: 0.5rem 1.25rem;
}

.drawer-fact {
  display: contents;
}

.drawer-fact dt {
  color: var(--muted);
}

.drawer-fact dd {
  margin: 0;
  overflow-wrap: anywhere;
}

.drawer-boosts {
  justify-content: flex-start;
  margin-top: 0.25rem;
}

.drawer-description {
  overflow-wrap: anywhere;
}

@media (max-width: 56rem) {
  .filters {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .filter-search {
    grid-column: 1 / -1;
  }
}

@media (max-width: 40rem) {
  .profile dl {
    grid-template-columns: minmax(0, 1fr);
  }

  /* Short facts become one row each, so the tabs stay near the top on a phone. */
  .fact:not(.fact-wide) {
    flex-direction: row;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
  }

  .fact:not(.fact-wide) dd {
    text-align: right;
  }

  .panel {
    padding-block: 1.75rem;
  }

  .posting {
    grid-template-columns: 1.25rem 1.5rem minmax(0, 1fr);
    gap: 0.25rem 0.625rem;
    padding: 0.875rem 0.75rem;
  }

  .skip-prompt {
    grid-column: 1 / -1;
  }

  .filter-show legend {
    float: none;
    margin: 0 0 0.25rem;
  }

  .filter-show {
    flex-direction: column;
    align-items: stretch;
    gap: 0;
  }

  .segments {
    display: flex;
  }

  .segment {
    flex: 1;
    text-align: center;
  }

  .segment > span {
    padding-inline: 0.5rem;
  }

  .queue-bar {
    padding: 0.625rem 0.875rem;
    gap: 0.375rem 0.75rem;
  }

  /* The count's parts join the bar's own wrapping, so the link shares a line with them. */
  .queue-bar-count {
    display: contents;
  }

  .queue-bar-link {
    margin-left: auto;
  }

  /* "Progress board" alone fits beside the count on a phone; the link's name stays whole. */
  .queue-bar-link-lead {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }

  .posting-side {
    grid-column: 3;
    flex-direction: row;
    flex-wrap: wrap;
    align-items: center;
    justify-content: flex-start;
    text-align: left;
  }

  .boosts {
    justify-content: flex-start;
  }

  .posting-sources {
    max-width: none;
  }
}

/* Sources panel: a side sheet with a switch per Source, the watchlist and Add by URL */

.workspace-bar {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  border-bottom: 1px solid var(--line);
}

.workspace-bar .tabs {
  flex: 1;
  min-width: 0;
  border-bottom: 0;
}

.bar-button {
  appearance: none;
  display: inline-flex;
  align-items: center;
  gap: 0.4375rem;
  flex: none;
  font: inherit;
  font-size: var(--step--1);
  font-weight: 600;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 0.3125rem 0.875rem 0.3125rem 0.6875rem;
  cursor: pointer;
}

.bar-button:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.sheet {
  box-sizing: border-box;
  margin: 0 0 0 auto;
  width: min(34rem, 100vw);
  max-width: 100vw;
  height: 100dvh;
  max-height: 100dvh;
  padding: 0;
  border: 0;
  border-left: 1px solid var(--line);
  background: var(--bg);
  color: var(--ink);
  box-shadow: -12px 0 40px rgb(10 16 28 / 18%);
  overscroll-behavior: contain;
}

.sheet::backdrop {
  background: rgb(10 16 28 / 38%);
}

.sheet[open] {
  animation: sheet-in 180ms ease-out;
}

@keyframes sheet-in {
  from {
    transform: translateX(1.5rem);
    opacity: 0;
  }
}

.sheet-body {
  display: flex;
  flex-direction: column;
  gap: 1rem;
  padding: 1.25rem max(1.25rem, env(safe-area-inset-right, 0px)) 2rem 1.25rem;
}

.sheet-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
}

.sheet-header h2 {
  font-size: var(--step-2);
}

.sheet-intro {
  color: var(--muted);
}

.icon-button {
  appearance: none;
  display: inline-grid;
  place-items: center;
  width: 2.25rem;
  height: 2.25rem;
  padding: 0;
  border: 1px solid transparent;
  border-radius: 999px;
  background: none;
  color: var(--muted);
  cursor: pointer;
}

.icon-button:hover {
  color: var(--ink);
  background: var(--surface);
  border-color: var(--line);
}

.source {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  padding: 1rem;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
}

.source-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
}

.source-head h3 {
  margin: 0;
  font-family: var(--font-display);
  font-size: var(--step-1);
}

.source-about {
  color: var(--muted);
  font-size: var(--step--1);
}

.source-status {
  font-size: var(--step--1);
  font-weight: 600;
}

.source-off .source-status {
  color: var(--muted);
}

.source-off .source-items,
.source-off .source-empty {
  opacity: 0.6;
}

.switch {
  appearance: none;
  position: relative;
  flex: none;
  width: 2.75rem;
  height: 1.5rem;
  padding: 0;
  border: 0;
  border-radius: 999px;
  background: var(--line);
  cursor: pointer;
  transition: background-color 120ms ease;
}

.switch[aria-checked="true"] {
  background: var(--accent);
}

.switch-thumb {
  position: absolute;
  top: 0.1875rem;
  left: 0.1875rem;
  width: 1.125rem;
  height: 1.125rem;
  border-radius: 999px;
  background: #ffffff;
  box-shadow: 0 1px 2px rgb(10 16 28 / 30%);
  transition: transform 120ms ease;
}

.switch[aria-checked="true"] .switch-thumb {
  transform: translateX(1.25rem);
}

.switch:disabled,
.button:disabled,
.source-item .link-button:disabled {
  cursor: progress;
  opacity: 0.7;
}

.source-empty {
  color: var(--muted);
  font-size: var(--step--1);
  padding-block: 0.25rem;
}

.source-items {
  list-style: none;
  margin: 0.25rem 0 0;
  padding: 0;
  border-top: 1px solid var(--line);
}

.source-item {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 1rem;
  padding-block: 0.625rem;
  border-bottom: 1px solid var(--line);
}

.source-item-main {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 0.0625rem;
}

.source-item h4 {
  margin: 0;
  font-size: var(--step-0);
  font-weight: 600;
  overflow-wrap: anywhere;
}

.source-item h4 a,
.source-item-meta a {
  color: inherit;
  text-decoration: none;
  border-radius: 2px;
}

.source-item h4 a:hover,
.source-item-meta a:hover {
  color: var(--accent);
  text-decoration: underline;
}

.source-item-meta,
.source-item-status {
  font-size: var(--step--1);
  color: var(--muted);
  overflow-wrap: anywhere;
}

.source-item-problem {
  color: var(--problem-ink);
}

.source-item .link-button {
  flex: none;
  font-size: var(--step--1);
  padding-top: 0.125rem;
}

.source-form {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  align-items: end;
  gap: 0.625rem 0.75rem;
  margin-top: 0.5rem;
}

.source-form-watchlist {
  grid-template-columns: minmax(0, 1fr) auto;
}

.source-form-watchlist .field-wide {
  grid-column: 1 / -1;
}

.source-form-added .button {
  justify-self: start;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
  min-width: 0;
}

.field-wide {
  grid-column: 1 / -1;
}

.field-label {
  font-size: var(--step--1);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--muted);
}

.field input {
  font: inherit;
  color: var(--ink);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 0.4375rem 0.625rem;
  min-width: 0;
  width: 100%;
  box-sizing: border-box;
}

.field input::placeholder {
  color: var(--muted);
  opacity: 0.75;
}

.field input[aria-invalid="true"] {
  border-color: var(--problem-ink);
}

.field-error {
  grid-column: 1 / -1;
  font-size: var(--step--1);
  color: var(--problem-ink);
}

.button {
  appearance: none;
  font: inherit;
  font-weight: 600;
  color: #ffffff;
  background: var(--accent);
  border: 1px solid var(--accent);
  border-radius: 8px;
  padding: 0.4375rem 1rem;
  cursor: pointer;
  white-space: nowrap;
}

:root[data-theme="dark"] .button {
  color: var(--bg);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .button {
    color: var(--bg);
  }
}

.button:hover {
  filter: brightness(1.08);
}

.bar-button:focus-visible,
.icon-button:focus-visible,
.switch:focus-visible,
.button:focus-visible,
.field input:focus-visible,
.source-item a:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

@media (max-width: 30rem) {
  /* Icon only, so the button never crowds the tabs on a phone; its name stays for screen readers. */
  .bar-button {
    padding: 0.4375rem;
  }

  .bar-button-label {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
}

@media (max-width: 40rem) {
  .source-form {
    grid-template-columns: minmax(0, 1fr);
  }

  .source-form-watchlist {
    grid-template-columns: minmax(0, 1fr) auto;
  }
}

@media (prefers-reduced-motion: reduce) {
  * {
    transition: none !important;
    animation: none !important;
  }
}
