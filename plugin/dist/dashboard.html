.empty-compact {

/* Detail drawer: a modal panel from the right edge, full height, scrolling on its own. */
.drawer {
  box-sizing: border-box;
  margin: 0 0 0 auto;
  padding: 0;
  width: min(36rem, 100vw);
  max-width: 100vw;
  height: 100dvh;
  max-height: 100dvh;
  border: 0;
  border-left: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  box-shadow: -12px 0 32px rgb(10 16 28 / 0.18);
}

.drawer[open] {
  animation: drawer-in 180ms ease-out;
}

/* The page behind an open drawer stays put. */
html:has(.drawer[open]) {
  overflow: hidden;
}

@media (max-width: 36rem) {
  .drawer {
    border-left: 0;
    box-shadow: none;
  }

  .drawer-body {

}

.drawer::backdrop {

}

  height: 100%;

  padding: 1.25rem 1.5rem 1rem;
  border-bottom: 1px solid var(--line);
}

}

  line-height: 1.3;

}

  margin: -0.25rem -0.5rem 0 0;
  appearance: none;
  border: 0;
  border-radius: 8px;
  background: none;
  color: var(--muted);
  cursor: pointer;
}

.drawer-close:hover {
  background: var(--bg);
  color: var(--ink);
}

.drawer-close path {
  stroke: currentColor;
  stroke-width: 1.75;
  stroke-linecap: round;
}

.drawer-body {
  flex: 1;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 1.25rem 1.5rem 2rem;
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
}

.drawer-apply {
  align-self: flex-start;
  padding: 0.5rem 1rem;
  border-radius: 999px;
  background: var(--accent);
  color: var(--surface);
  font-weight: 600;
  text-decoration: none;
}

.drawer-apply:hover {
  filter: brightness(1.08);
}

.drawer-apply-host {
  font-weight: 400;
  opacity: 0.85;
}

.drawer-section {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.drawer-heading {
  margin: 0;
  font-size: var(--step--1);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--muted);
}

.variant-choice {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.variant-choice select {
  font: inherit;
  font-weight: 500;
  color: var(--ink);
  background-color: var(--bg);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 0.4375rem 2rem 0.4375rem 0.625rem;
  min-width: 0;
  max-width: 100%;
  appearance: none;
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted) 50%),
    linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position:
    calc(100% - 1rem) 50%,
    calc(100% - 0.6875rem) 50%;
  background-size: 0.3125rem 0.3125rem;
  background-repeat: no-repeat;
}

.variant-status {
  font-size: var(--step--1);
  color: var(--muted);
}

.variant-name {
  font-weight: 500;
}

.variant-reason {
  font-size: var(--step--1);
  overflow-wrap: anywhere;
}

.variant-error {
  padding: 0.5rem 0.75rem;
  border-radius: 8px;
  background: var(--problem-bg);
  color: var(--problem-ink);
  font-size: var(--step--1);
}

.drawer-facts {
  margin: 0;
  display: grid;
  grid-template-columns: max-content minmax(0, 1fr);
  gap: 0.5rem 1.25rem;
}

.drawer-fact {
  display: contents;
}

.drawer-fact dt {
  color: var(--muted);
}

.drawer-fact dd {
  margin: 0;
  overflow-wrap: anywhere;
}

.drawer-boosts {
  justify-content: flex-start;
  margin-top: 0.25rem;
}

.drawer-description {
  overflow-wrap: anywhere;
}

@media (max-width: 56rem) {
  .filters {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .filter-search {
    grid-column: 1 / -1;
  }
}

@media (max-width: 40rem) {
  .profile dl {
    grid-template-columns: minmax(0, 1fr);
  }

  /* Short facts become one row each, so the tabs stay near the top on a phone. */
  .fact:not(.fact-wide) {
    flex-direction: row;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
  }

  .fact:not(.fact-wide) dd {
    text-align: right;
  }

  .panel {
    padding-block: 1.75rem;
  }

  .posting {
    grid-template-columns: 1.25rem 1.5rem minmax(0, 1fr);
    gap: 0.25rem 0.625rem;
    padding: 0.875rem 0.75rem;
  }

  .skip-prompt {
    grid-column: 1 / -1;
  }

  .filter-show legend {
    float: none;
    margin: 0 0 0.25rem;
  }

  .filter-show {
    flex-direction: column;
    align-items: stretch;
    gap: 0;
  }

  .segments {
    display: flex;
  }

  .segment {
    flex: 1;
    text-align: center;
  }

  .segment > span {
    padding-inline: 0.5rem;
  }

  .queue-bar {
    padding: 0.625rem 0.875rem;
    gap: 0.375rem 0.75rem;
  }

  /* The count's parts join the bar's own wrapping, so the link shares a line with them. */
  .queue-bar-count {
    display: contents;
  }

  .queue-bar-link {
    margin-left: auto;
  }

  /* "Progress board" alone fits beside the count on a phone; the link's name stays whole. */
  .queue-bar-link-lead {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }

  .posting-side {
    grid-column: 3;
    flex-direction: row;
    flex-wrap: wrap;
    align-items: center;
    justify-content: flex-start;
    text-align: left;
  }

  .boosts {
    justify-content: flex-start;
  }

  .posting-sources {
    max-width: none;
  }
}

@media (prefers-reduced-motion: reduce) {
  * {
    transition: none !important;
    animation: none !important;
  }
}
