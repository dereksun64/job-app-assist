<title>Job App Assist</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: a masthead with the Search Profile as a ledger strip, then one tabbed workspace. */
:root {
  --bg: #f4f6f9;
  --surface: #ffffff;
  --ink: #172030;
  --muted: #5a6577;
  --line: #dce2eb;
  --accent: #2f5bd3;
  --accent-soft: #e5ebfb;
  --notice-bg: #fff3dc;
  --notice-ink: #6f4500;
  --problem-bg: #fcebeb;
  --problem-ink: #9a1d1d;

  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Instrument Sans", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --step--1: 0.8125rem;
  --step-0: 0.9375rem;
  --step-1: 1.125rem;
  --step-2: 1.5rem;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e131b;
    --surface: #151c27;
    --ink: #e5e9f0;
    --muted: #98a3b6;
    --line: #263041;
    --accent: #84a1ff;
    --accent-soft: #1d2a4f;
    --notice-bg: #33270f;
    --notice-ink: #f1c879;
    --problem-bg: #3a1818;
    --problem-ink: #ffb4b4;
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: #0e131b;
  --surface: #151c27;
  --ink: #e5e9f0;
  --muted: #98a3b6;
  --line: #263041;
  --accent: #84a1ff;
  --accent-soft: #1d2a4f;
  --notice-bg: #33270f;
  --notice-ink: #f1c879;
  --problem-bg: #3a1818;
  --problem-ink: #ffb4b4;
  color-scheme: dark;
}

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--step-0);
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

.shell {
  max-width: 68rem;
  margin-inline: auto;
  padding-block: 1.5rem 2rem;
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
}

h1,
h2 {
  font-family: var(--font-display);
  text-wrap: balance;
  margin: 0;
}

p {
  margin: 0;
}

code {
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
}

/* Masthead and Search Profile ledger */

.masthead {
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.wordmark {
  font-size: var(--step-2);
  font-weight: 700;
  letter-spacing: -0.01em;
}

.profile dl {
  margin: 0;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
}

.fact {
  background: var(--surface);
  padding: 0.75rem 1rem;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
}

.fact-wide {
  grid-column: 1 / -1;
}

.fact dt {
  font-size: var(--step--1);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--muted);
}

.fact dd {
  margin: 0;
  overflow-wrap: anywhere;
}

.numeric {
  font-variant-numeric: tabular-nums;
}

.groups {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-wrap: wrap;
  gap: 0.25rem 1.5rem;
}

.group-label {
  font-weight: 600;
}

/* Notices */

.notice {
  margin: 0;
  padding: 0.75rem 1rem;
  border-radius: 10px;
  background: var(--notice-bg);
  color: var(--notice-ink);
}

.notice-quiet {
  background: var(--accent-soft);
  color: var(--ink);
}

.notice-problem {
  background: var(--problem-bg);
  color: var(--problem-ink);
}

.issues {
  margin: 0.5rem 0 0;
  padding-left: 1.25rem;
  font-family: var(--font-mono);
  font-size: var(--step--1);
}

/* Tabs */

.workspace {
  display: flex;
  flex-direction: column;
}

.tabs {
  display: flex;
  gap: 0.25rem;
  border-bottom: 1px solid var(--line);
}

.tab {
  appearance: none;
  border: 0;
  background: none;
  color: var(--muted);
  font: inherit;
  font-weight: 600;
  padding: 0.625rem 0.875rem;
  margin-bottom: -1px;
  border-bottom: 2px solid transparent;
  cursor: pointer;
  white-space: nowrap;
}

.tab:hover {
  color: var(--ink);
}

.tab[aria-selected="true"] {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

.tab:focus-visible,
.panel:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 4px;
}

.panel {
  padding-block: 2.5rem;
}

/* Empty states */

.empty {
  max-width: 40rem;
  margin-inline: auto;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.75rem;
  color: var(--muted);
}

.empty p {
  max-width: 34rem;
}

.empty h2 {
  font-size: var(--step-1);
  color: var(--ink);
}

.stages {
  list-style: none;
  margin: 0.5rem 0 0;
  padding: 0;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 0.5rem;
}

.stages li {
  padding: 0.25rem 0.75rem;
  border: 1px dashed var(--line);
  border-radius: 999px;
  font-size: var(--step--1);
  color: var(--muted);
}

.colophon {
  font-size: var(--step--1);
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}

/* Postings tab: status, filters and the ranked Job List */

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

.muted {
  color: var(--muted);
}

.panel:has(> .job-list) {
  padding-block: 1.25rem 0;
}

.job-list {
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.job-list-status {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: 0.25rem 1rem;
  color: var(--muted);
}

.job-list-status strong {
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}

.job-list-updating {
  color: var(--accent);
  font-weight: 600;
}

.filters {
  display: grid;
  grid-template-columns: minmax(14rem, 2fr) repeat(4, minmax(0, 1fr));
  gap: 0.75rem;
  padding: 0.875rem 1rem;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
}

.filter {
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
  min-width: 0;
}

.filter-label {
  font-size: var(--step--1);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--muted);
}

.filter input,
.filter select {
  font: inherit;
  color: var(--ink);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 0.4375rem 0.625rem;
  min-width: 0;
  width: 100%;
  box-sizing: border-box;
}

.filter select {
  appearance: none;
  padding-right: 2rem;
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted) 50%),
    linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position:
    calc(100% - 1rem) 50%,
    calc(100% - 0.6875rem) 50%;
  background-size: 0.3125rem 0.3125rem;
  background-repeat: no-repeat;
  text-overflow: ellipsis;
}

.filter input:focus-visible,
.filter select:focus-visible,
.link-button:focus-visible,
.show-more:focus-visible,
.posting-title a:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.job-list-count {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 1rem;
  font-size: var(--step--1);
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}

.link-button {
  appearance: none;
  border: 0;
  background: none;
  padding: 0;
  font: inherit;
  font-weight: 600;
  color: var(--accent);
  cursor: pointer;
  border-radius: 4px;
}

.link-button:hover {
  text-decoration: underline;
}

.postings {
  list-style: none;
  margin: 0;
  padding: 0;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
}

.posting {
  display: grid;
  grid-template-columns: 2.5rem minmax(0, 1fr) minmax(9rem, auto);
  gap: 0.25rem 1rem;
  align-items: start;
  padding: 0.875rem 1rem;
}

.posting + .posting {
  border-top: 1px solid var(--line);
}

.posting-rank {
  font-size: var(--step--1);
  font-weight: 600;
  color: var(--muted);
  padding-top: 0.1875rem;
  text-align: right;
}

.posting-main {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 0.125rem;
}

.posting-title {
  margin: 0;
  font-family: var(--font-body);
  font-size: var(--step-0);
  font-weight: 600;
  line-height: 1.35;
  overflow-wrap: anywhere;
}

.posting-title a {
  color: var(--ink);
  text-decoration: none;
  border-radius: 2px;
}

.posting-title a:hover {
  color: var(--accent);
  text-decoration: underline;
}

.posting-company {
  font-weight: 500;
}

.posting-facts {
  list-style: none;
  margin: 0.25rem 0 0;
  padding: 0;
  display: flex;
  flex-wrap: wrap;
  gap: 0.125rem 0;
  font-size: var(--step--1);
  color: var(--muted);
}

.posting-facts li {
  overflow-wrap: anywhere;
}

/* Separators trail each fact, so a wrapped line never starts with one. */
.posting-facts li:not(:last-child)::after {
  content: "\00B7";
  padding-inline: 0.5rem;
  color: var(--muted);
  opacity: 0.5;
  font-weight: 700;
}

.posting-side {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 0.375rem;
  text-align: right;
}

.score {
  min-width: 2.5rem;
  padding: 0.125rem 0.5rem;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 700;
  font-size: var(--step--1);
  text-align: center;
}

.boosts {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 0.25rem;
}

.boosts li {
  padding: 0.0625rem 0.5rem;
  border: 1px solid var(--line);
  border-radius: 999px;
  font-size: 0.75rem;
  color: var(--muted);
  white-space: nowrap;
}

.posting-sources {
  font-size: 0.75rem;
  color: var(--muted);
  max-width: 14rem;
}

.show-more {
  align-self: center;
  appearance: none;
  font: inherit;
  font-weight: 600;
  color: var(--accent);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 0.5rem 1.25rem;
  cursor: pointer;
}

.show-more:hover {
  background: var(--accent-soft);
}

.empty-compact {
  padding-block: 1.5rem;
}

@media (max-width: 56rem) {
  .filters {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .filter-search {
    grid-column: 1 / -1;
  }
}

@media (max-width: 40rem) {
  .profile dl {
    grid-template-columns: minmax(0, 1fr);
  }

  /* Short facts become one row each, so the tabs stay near the top on a phone. */
  .fact:not(.fact-wide) {
    flex-direction: row;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
  }

  .fact:not(.fact-wide) dd {
    text-align: right;
  }

  .panel {
    padding-block: 1.75rem;
  }

  .posting {
    grid-template-columns: 1.75rem minmax(0, 1fr);
    padding: 0.875rem 0.75rem;
  }

  .posting-side {
    grid-column: 2;
    flex-direction: row;
    flex-wrap: wrap;
    align-items: center;
    justify-content: flex-start;
    text-align: left;
  }

  .boosts {
    justify-content: flex-start;
  }

  .posting-sources {
    max-width: none;
  }
}

@media (prefers-reduced-motion: reduce) {
  * {
    transition: none !important;
    animation: none !important;
  }
}
